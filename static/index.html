<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.dataset.theme = localStorage.getItem("v2g_theme") || "dark";</script>
<title>Video2Guide · B站长视频文字攻略</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23fb7299' d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/></svg>">
<link rel="stylesheet" href="/static/style.css?v=20">
</head>
<body>

<header class="topbar">
  <a id="brand" class="brand" href="#/" title="回到主页">
    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    <span class="brand-name">Video2Guide</span>
    <span class="brand-sub">B站长视频 · 一键文字攻略</span>
  </a>
  <button id="btn-sidebar" class="icon-btn" title="合集列表" aria-label="合集列表">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>合集</span>
  </button>
  <button id="btn-theme" class="icon-btn" title="切换亮/暗主题" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>主题</span>
  </button>
  <button id="btn-settings" class="icon-btn" title="设置（API Key / B站 Cookie）" aria-label="设置">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h4M12 17h8M4 12h16"/><circle cx="16" cy="7" r="2.2" fill="var(--bg)"/><circle cx="10" cy="17" r="2.2" fill="var(--bg)"/><circle cx="8" cy="12" r="2.2" fill="var(--bg)"/></svg>
    <span>设置</span>
  </button>
</header>

<main class="layout">
  <!-- ⓪ 左侧栏：未选合集时展示合集列表；选中后展示合集内视频，可返回 -->
  <aside id="sidebar" class="sidebar" aria-label="合集浏览">
    <div id="sb-collections" class="sb-pane">
      <div class="sb-pane-head">
        <span class="sb-title">合集</span>
        <input id="sb-search" class="sb-search" type="text" placeholder="搜索视频…" autocomplete="off">
      </div>
      <div id="sb-coll-list" class="sb-list"></div>
    </div>
    <div id="sb-episodes" class="sb-pane hidden">
      <div class="sb-pane-head">
        <button id="btn-sb-back" class="sb-back" title="返回合集列表">‹ 合集列表</button>
        <div class="sb-coll-title" id="sb-coll-title"></div>
        <div class="sb-coll-meta" id="sb-coll-meta"></div>
      </div>
      <div class="sb-tools">
        <div class="seg" id="seg-col-sort" role="radiogroup" aria-label="合集内排序">
          <button data-val="order" class="on" title="按视频发布时间正序（追更顺序）">视频顺序</button>
          <button data-val="pubdesc" title="按视频发布时间倒序">最新发布</button>
          <button data-val="created" title="按攻略生成时间倒序">最新生成</button>
        </div>
        <button id="btn-parse-new" class="btn-ghost btn-sm" title="选择合集中还没解析过的视频批量生成攻略">解析新视频</button>
      </div>
      <div id="sb-ep-list" class="sb-list"></div>
    </div>
  </aside>

  <div class="content">
  <!-- ① 输入 -->
  <section id="input-card" class="card">
    <div class="hero" id="hero">
      <h1>Video2Guide</h1>
      <p class="hero-tip">粘贴 B 站链接，把长攻略视频压缩成带时间戳跳转与关键截图的文字攻略</p>
    </div>
    <div class="input-row">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10 14a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.4 5.53"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 10a5 5 0 0 0-7.07 0L4.1 12.83a5 5 0 0 0 7.07 7.07l1.42-1.42"/></svg>
        <input id="url" type="text" autocomplete="off" spellcheck="false"
               placeholder="粘贴 B 站视频链接（支持 BV 号 / av 号 / b23.tv 短链）">
      </div>
      <button id="btn-import" class="btn-ghost" title="导入别人分享的 .v2g 攻略文件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
        导入
      </button>
      <input id="import-file" type="file" accept=".v2g,.zip" class="hidden">
      <button id="btn-go" class="btn-primary" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        生成攻略
      </button>
    </div>
    <div class="options-row">
      <div class="opt-group">
        <span class="opt-label">攻略风格</span>
        <div class="seg" id="seg-style" role="radiogroup" aria-label="攻略风格">
          <button data-val="brief" role="radio">极简</button>
          <button data-val="standard" role="radio" class="on">标准</button>
          <button data-val="detailed" role="radio">详细</button>
        </div>
      </div>
      <div class="opt-group">
        <span class="opt-label">关键截图</span>
        <div class="seg" id="seg-shots" role="radiogroup" aria-label="截图数量">
          <button data-val="0" role="radio">不用</button>
          <button data-val="3" role="radio">3 张</button>
          <button data-val="6" role="radio" class="on">6 张</button>
          <button data-val="9" role="radio">9 张</button>
        </div>
      </div>
    </div>
    <div class="ref-row">
      <svg class="ref-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h10M4 18h13"/></svg>
      <input id="reference-url" type="text" autocomplete="off" spellcheck="false"
             placeholder="参考文档链接（可选，如 UP 主的文字版攻略，支持腾讯文档，每次解析实时更新）">
    </div>
    <div class="example-row">
      <span class="example-label">试一试：</span>
      <a href="https://www.bilibili.com/video/BV1LeMU6XEJL" id="example-link"
         title="点击填入示例视频">星露谷物语·一年115完美挑战攻略（44 分钟）</a>
    </div>
  </section>

  <!-- ② 进度 -->
  <section id="progress-card" class="card hidden">
    <div class="progress-title">
      <span class="spinner" aria-hidden="true"></span>
      <span id="progress-text">任务进行中…</span>
      <span class="elapsed" id="elapsed"></span>
    </div>
    <div class="stepper" id="stepper"></div>
    <div class="term" id="logs" aria-live="polite"></div>
  </section>

  <!-- ③ 错误 -->
  <section id="error-card" class="card card-error hidden">
    <div class="error-head">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/></svg>
      <span>出错了</span>
    </div>
    <p id="error-msg" class="error-msg"></p>
    <div class="error-actions">
      <button id="btn-retry" class="btn-ghost">重试</button>
      <button id="btn-error-settings" class="btn-ghost hidden">打开设置</button>
    </div>
  </section>

  <!-- ④ 结果 -->
  <section id="result-card" class="card hidden">
    <div class="result-banner">
      <img id="result-cover" alt="视频封面" loading="lazy">
      <div class="result-meta">
        <h2 id="result-title"></h2>
        <div class="meta-chips">
          <span class="chip" id="chip-uploader"></span>
          <span class="chip" id="chip-duration"></span>
          <span class="chip chip-soft" id="chip-subtitle"></span>
          <span class="chip chip-soft" id="chip-model"></span>
          <a class="chip chip-soft chip-link hidden" id="chip-season" href="#/" title="查看该合集的全部攻略"></a>
        </div>
        <div class="ep-nav hidden" id="ep-nav">
          <button id="btn-prev-ep" class="btn-ghost btn-sm" title="合集内上一集（←）">‹ 上一集</button>
          <span id="ep-pos" class="ep-pos"></span>
          <button id="btn-next-ep" class="btn-ghost btn-sm" title="合集内下一集（→）">下一集 ›</button>
        </div>
        <a id="link-origin" class="link-origin" target="_blank" rel="noopener">
          在 B 站打开原视频 ↗
        </a>
      </div>
    </div>
    <div id="warn-strip" class="warn-strip hidden"></div>
    <article class="guide-content" id="guide"></article>
    <div id="shots-block">
      <h3 class="shots-title">关键画面</h3>
      <div class="shots-grid" id="shots"></div>
    </div>
    <div id="comments-block" class="comments-block">
      <h3 class="comments-title">评论 <span id="comment-count" class="comment-count"></span></h3>
      <div id="comment-list" class="comment-list"></div>
      <div class="comment-form">
        <input id="comment-name" type="text" placeholder="昵称（可留空，默认匿名）" maxlength="20" autocomplete="off">
        <textarea id="comment-text" placeholder="对这篇攻略有什么补充或想法？" maxlength="500"></textarea>
        <button id="btn-comment" class="btn-primary btn-sm">发表评论</button>
      </div>
    </div>
    <div class="result-actions">
      <a id="btn-export" class="btn-ghost" title="导出为 .v2g，可分享给他人导入">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 15V3m0 0 4 4m-4-4-4 4M4 21h16"/></svg>
        导出 .v2g
      </a>
      <button id="btn-copy" class="btn-ghost">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        复制 Markdown
      </button>
      <a id="btn-download" class="btn-ghost" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
        下载 .md
      </a>
      <button id="btn-new" class="btn-ghost">再来一个视频</button>
    </div>
  </section>

  <!-- ⑤ 历史（已由左侧栏承担浏览职责） -->

  <footer class="foot">本地运行 · 字幕与视频版权归原作者所有 · 生成内容仅供个人学习参考</footer>
  </div>
</main>

<!-- 设置弹窗 -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal" role="dialog" aria-label="设置">
    <div class="modal-head">
      <span>设置</span>
      <button id="btn-modal-close" class="icon-btn-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-name">GLM API Key <i class="req">必填</i></span>
        <div class="field-input">
          <input id="set-key" type="password" placeholder="在 open.bigmodel.cn 获取" autocomplete="off">
          <button class="reveal" data-target="set-key" aria-label="显示/隐藏">显示</button>
        </div>
        <span class="field-hint" id="hint-key"></span>
      </label>
      <label class="field">
        <span class="field-name">模型</span>
        <input id="set-model" type="text" placeholder="glm-5.3-flash" autocomplete="off">
        <span class="field-hint">默认 glm-5.3-flash，可换成你有权限的任意模型名</span>
      </label>
      <label class="field">
        <span class="field-name">B 站 SESSDATA Cookie</span>
        <div class="field-input">
          <input id="set-sessdata" type="password" placeholder="获取 AI 智能字幕需要登录态" autocomplete="off">
          <button class="reveal" data-target="set-sessdata" aria-label="显示/隐藏">显示</button>
        </div>
        <span class="field-hint">获取方法：电脑浏览器登录 B 站 → F12 打开开发者工具 → 应用/存储 → Cookie → 复制 SESSDATA 的值。仅保存在本机，用于拉取字幕。</span>
      </label>
    </div>
    <div class="modal-foot">
      <button id="btn-save-settings" class="btn-primary btn-sm">保存</button>
    </div>
  </div>
</div>

<!-- 章节目录（宽屏悬浮） -->
<nav id="toc" class="toc hidden" aria-label="章节目录"></nav>

<!-- 阅读进度条 -->
<div id="read-progress" class="read-progress"></div>

<!-- 回到顶部 -->
<button id="btn-top" class="btn-top hidden" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
</button>

<!-- 图片灯箱 -->
<div id="lightbox" class="lightbox hidden" role="dialog" aria-label="图片预览">
  <div class="lightbox-body">
    <img id="lightbox-img" alt="">
    <div class="lightbox-bar">
      <span id="lightbox-caption"></span>
      <a id="lightbox-jump" class="btn-ghost" target="_blank" rel="noopener">▶ 去 B 站看此片段</a>
    </div>
  </div>
</div>

<!-- 访问密钥弹窗 -->
<div id="access-mask" class="modal-mask hidden">
  <div class="modal" role="dialog" aria-label="访问密钥">
    <div class="modal-head">
      <span>需要访问密钥</span>
      <button id="btn-access-close" class="icon-btn-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-name">访问密钥</span>
        <input id="access-key-input" type="password" placeholder="请输入访问密钥" autocomplete="off">
        <span class="field-hint">请联系 462574808@qq.com 获取密钥</span>
      </label>
    </div>
    <div class="modal-foot">
      <button id="btn-access-ok" class="btn-primary btn-sm">确认并生成</button>
    </div>
  </div>
</div>

<!-- 合集选集弹窗 -->
<div id="season-mask" class="modal-mask hidden">
  <div class="modal modal-wide" role="dialog" aria-label="选择合集视频">
    <div class="modal-head">
      <span id="season-title">选择合集视频</span>
      <button id="btn-season-close" class="icon-btn-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body season-body">
      <div class="season-sub" id="season-sub"></div>
      <div class="season-tools">
        <label class="season-all"><input type="checkbox" id="season-all"> 全选未解析</label>
        <span id="season-selected" class="season-selected">已选 0 个</span>
      </div>
      <div id="season-list" class="season-list"></div>
    </div>
    <div class="modal-foot">
      <button id="btn-season-current" class="btn-ghost">仅当前视频</button>
      <button id="btn-season-go" class="btn-primary btn-sm" disabled>生成攻略</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js?v=20"></script>
</body>
</html>
